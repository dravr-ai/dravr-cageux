# ABOUTME: MCP server crate exposing sports science intelligence via Model Context Protocol
# ABOUTME: Supports stdio and HTTP transports with analysis, algorithm, and nutrition tools
#
# SPDX-License-Identifier: MIT OR Apache-2.0
# Copyright (c) 2026 dravr.ai

[package]
name = "dravr-cageux-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "MCP server for dravr-cageux sports science engine — expose intelligence via Model Context Protocol"
repository = "https://github.com/dravr-ai/dravr-cageux"
readme = "README.md"
keywords = ["mcp", "fitness", "sports-science", "json-rpc", "intelligence"]
categories = ["science", "development-tools"]
publish = false

[lib]
name = "dravr_cageux_mcp"
path = "src/lib.rs"

[[bin]]
name = "dravr-cageux-mcp"
path = "src/main.rs"

[dependencies]
dravr-cageux = { path = "../..", version = "0.1.0" }
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.50", features = ["full", "test-util"] }

[lints]
workspace = true
