[package]
name = "dravr-cageux-server"
version = "0.5.3"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Unified REST API + MCP server for dravr-cageux sports science intelligence engine"
repository = "https://github.com/dravr-ai/dravr-cageux"
readme = "README.md"
keywords = ["fitness", "sports-science", "rest", "mcp", "server"]
categories = ["science", "web-programming::http-server"]
publish = false

[lib]
name = "dravr_cageux_server"
path = "src/lib.rs"

[[bin]]
name = "dravr-cageux-server"
path = "src/main.rs"

[dependencies]
dravr-cageux = { path = "../..", version = "0.5.3" }
dravr-cageux-mcp = { path = "../dravr-cageux-mcp", version = "0.5.3" }
dravr-tronc = { version = "0.5.3", features = ["notifications"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time"] }
tracing = "0.1"

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1.50", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
